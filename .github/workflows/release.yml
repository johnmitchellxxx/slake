# Builds the Mac and Windows installers on GitHub's own machines and posts
# them to the repo's Releases page. Runs when a version tag like v0.4.0 is pushed.
name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A published release needs its version tag (like v0.8.0) to exist first.
  # Make it from package.json if it isn't there yet, then build.
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make the version tag
        run: |
          V="v$(node -p "require('./package.json').version")"
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            echo "$V already exists"
          else
            git tag "$V" && git push origin "$V" && echo "Made $V"
          fi

  build:
    needs: tag
    strategy:
      fail-fast: false
      # One at a time: if both builds create the release page at once, the
      # Mac one loses the race and its installer never gets attached.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build and publish
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No paid Apple certificate yet: sign "ad hoc" so it runs on Apple Silicon.
          CSC_IDENTITY_AUTO_DISCOVERY: false
