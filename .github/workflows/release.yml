# Builds the Mac and Windows installers on GitHub's own machines and posts
# them to the repo's Releases page. Runs when a version tag like v0.4.0 is pushed.
name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build and publish
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No paid Apple certificate yet: sign "ad hoc" so it runs on Apple Silicon.
          CSC_IDENTITY_AUTO_DISCOVERY: false
