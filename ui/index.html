<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Gossip</title>
  <link rel="stylesheet" href="style.css">
  <style id="theme"></style>
</head>
<body>
  <!-- First launch: pick a name, then start or join a group -->
  <section id="welcome" class="screen" hidden>
    <div class="card">
      <h1 class="wordmark">gossip</h1>
      <p class="sub">Chat that lives on your friends' computers. No server, no bill.</p>

      <form id="nameForm">
        <label for="nameInput">What should people call you?</label>
        <input id="nameInput" maxlength="40" autocomplete="off" placeholder="Your name" required>
        <button type="submit">Continue</button>
      </form>

      <div id="groupStep" hidden>
        <form id="createForm">
          <label for="groupName">Start a new group</label>
          <input id="groupName" maxlength="40" autocomplete="off" placeholder="Group name" required>
          <button type="submit">Start group</button>
        </form>
        <div class="or">or</div>
        <form id="joinForm">
          <label for="inviteInput">Join with an invite</label>
          <input id="inviteInput" autocomplete="off" placeholder="gossip:…" required>
          <button type="submit" class="secondary">Join</button>
        </form>
      </div>
      <p id="welcomeError" class="error" role="alert"></p>
    </div>
  </section>

  <!-- The main chat -->
  <section id="chat" class="screen" hidden>
    <aside class="sidebar">
      <header class="group">
        <div class="wordmark small">gossip</div>
        <div id="groupTitle" class="group-name"></div>
        <div id="peerStatus" class="peers"></div>
      </header>

      <nav>
        <div class="label">Channels</div>
        <ul id="channels"></ul>
        <form id="newChannel">
          <input id="newChannelInput" maxlength="32" placeholder="+ new channel" autocomplete="off">
        </form>
      </nav>

      <footer class="me">
        <button id="inviteBtn" class="secondary full">Copy invite link</button>
        <div class="theme-row">
          <select id="themeSelect" aria-label="Theme"></select>
          <button id="themesBtn" class="ghost" title="Open your themes folder">Edit</button>
        </div>
        <div id="meLine" class="me-line"></div>
      </footer>
    </aside>

    <main class="room">
      <header class="room-head"><span class="hash">#</span><span id="roomName"></span></header>
      <div id="messages" class="messages" aria-live="polite"></div>
      <form id="composer" class="composer">
        <textarea id="text" rows="1" maxlength="4000" placeholder="Say something…"></textarea>
        <button type="submit">Send</button>
      </form>
    </main>
  </section>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
